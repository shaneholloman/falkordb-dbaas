---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  namespace: observability
  name: vl-logs
  labels:
    is_logs: "true"
spec:
  groups:
    - name: kubernetes-logs-errors
      type: vlogs
      interval: 1m
      rules:
        - alert: SustainedErrorLogInK8s
          # LogsQL: Filter for error level logs, then group and count them by the pod and namespace.
          # Trigger if any pod/namespace combination generates more than 10 error logs per minute.
          expr: |
            level: "error" and -~".+Error accepting a client connection:.+" and -~"; using defaults" |
            stats by (pod, namespace, cluster, environment) count() as error_count |
            filter error_count :> 10
          for: 5m
          labels:
            severity: warning
            cluster: "{{ $labels.cluster }}"
            environment: "{{ $labels.environment }}"
          annotations:
            summary: "WARNING: Sustained Error Rate in {{ $labels.pod }} ({{ $labels.namespace }})"
            description: |
              [cluster={{ $labels.cluster }}] The pod '{{ $labels.pod }}' in namespace '{{ $labels.namespace }}' 
              has exceeded 10 errors per minute for the last 5 minutes.
              Latest 1-minute count: {{ $value }}.
            view_logs: 'https://grafana.observability{{ if eq $labels.environment "dev" }}.dev{{ end }}.internal.falkordb.cloud/explore?orgId=1&left=%7B%22datasource%22%3A%22VictoriaLogs%22%2C%22queries%22%3A%5B%7B%22expr%22%3A%22pod%3A%5C%22{{ $labels.pod }}%5C%22%20AND%20namespace%3A%5C%22{{ $labels.namespace }}%5C%22%22%7D%5D%7D'

        - alert: CriticalErrorLogSpikeInK8s
          # LogsQL: Similar to the warning, but triggers on an unacceptably high absolute count.
          # Trigger if a single pod/namespace combination generates more than 150 error logs per minute
          # (equivalent to 2.5 errors/second, indicating a potential crash loop or critical bug).
          expr: |
            level: "error" and -~".+Error accepting a client connection:.+" | 
            stats by (pod, namespace, cluster, environment) count() as error_count | 
            filter not (pod: "unknown" and namespace: "unknown") |
            filter error_count :> 150
          for: 2m
          labels:
            severity: critical
            cluster: "{{ $labels.cluster }}"
          annotations:
            summary: "CRITICAL: Major Error Log Spike in {{ $labels.pod }} ({{ $labels.namespace }})"
            description: |
              [cluster={{ $labels.cluster }}] CRITICAL FAILURE: The pod '{{ $labels.pod }}' in namespace '{{ $labels.namespace }}' 
              is generating error logs at an extremely high rate (over 150 per minute).
              Latest 1-minute count: {{ $value }}.
            runbook_url: "https://runbooks.falkordb.cloud/alerts/criticalerrorlogspikeink8srunbook/"
            view_logs: 'https://grafana.observability{{ if eq $labels.environment "dev" }}.dev{{ end }}.internal.falkordb.cloud/explore?orgId=1&left=%7B%22datasource%22%3A%22VictoriaLogs%22%2C%22queries%22%3A%5B%7B%22expr%22%3A%22pod%3A%5C%22{{ $labels.pod }}%5C%22%20AND%20namespace%3A%5C%22{{ $labels.namespace }}%5C%22%22%7D%5D%7D'

        - alert: SentinelHostnameResolutionFailure
          # LogsQL: Detect failed hostname resolution for sentinel nodes
          # Triggers when sentinel nodes fail to resolve hostnames (e.g., wrong sentinel address configuration)
          expr: |
            ~"Failed to resolve hostname .+f2e0a955bb84.cloud.+" and ~namespace: 'instance-.*' | 
            stats by (pod, namespace, cluster, environment) count() as failure_count | 
            filter failure_count :> 10
          for: 2m
          labels:
            severity: critical
            cluster: "{{ $labels.cluster }}"
            environment: "{{ $labels.environment }}"
          annotations:
            summary: "Sentinel hostname resolution failure in {{ $labels.pod }} ({{ $labels.namespace }})"
            description: |
              [cluster={{ $labels.cluster }}] The pod '{{ $labels.pod }}' in namespace '{{ $labels.namespace }}' 
              is experiencing hostname resolution failures, indicating a wrong sentinel address configuration.
              This can prevent proper sentinel communication. 
              Failure count in last 2 minutes: {{ $value }}.
            view_logs: 'https://grafana.observability{{ if eq $labels.environment "dev" }}.dev{{ end }}.internal.falkordb.cloud/explore?orgId=1&left=%7B%22datasource%22%3A%22VictoriaLogs%22%2C%22queries%22%3A%5B%7B%22expr%22%3A%22pod%3A%5C%22{{ $labels.pod }}%5C%22%20AND%20namespace%3A%5C%22{{ $labels.namespace }}%5C%22%20AND%20container%3A%5C%22service%5C%22%22%7D%5D%7D'

        - alert: RedisCrashed
          # LogsQL: Detect any Redis crash (signal crash or assertion failure).
          # Uses "=== REDIS BUG REPORT START" as the single anchor — Redis emits this line exactly
          # once per crash for ALL crash types (signal via sigsegvHandler and assertion via serverPanic).
          # This triggers log collection and a warning alert.
          # Note: Duplicate issues are prevented by checking for existing open issues in the alert-reaction script
          expr: |
            ~"=== REDIS BUG REPORT START" and -pod:~"vmalert*" | 
            stats by (pod, namespace, cluster, environment) count() as crash_count    
          for: 0m
          keep_firing_for: 5m
          labels:
            severity: warning
            cluster: "{{ $labels.cluster }}"
            environment: "{{ $labels.environment }}"
          annotations:
            summary: "Critical: Redis crashed in {{ $labels.pod }} ({{ $labels.namespace }})"
            description: |
              [cluster={{ $labels.cluster }}] Redis in pod '{{ $labels.pod }}' in namespace '{{ $labels.namespace }}' 
              has crashed (signal crash or assertion failure). Logs will be collected and a warning has been sent.
              Crash count: {{ $value }}.
            view_logs: 'https://grafana.observability{{ if eq $labels.environment "dev" }}.dev{{ end }}.internal.falkordb.cloud/explore?orgId=1&left=%7B%22datasource%22%3A%22VictoriaLogs%22%2C%22queries%22%3A%5B%7B%22expr%22%3A%22pod%3A%5C%22{{ $labels.pod }}%5C%22%20AND%20namespace%3A%5C%22{{ $labels.namespace }}%5C%22%20AND%20container%3A%5C%22service%5C%22%22%7D%5D%7D'

        - alert: RedisClusterJoinStuck
          # LogsQL: Detect when a Redis cluster join is stuck.
          # During cluster creation, redis-cli prints dots while waiting for nodes to join.
          # A normal join completes in seconds. If lines with 10+ consecutive dots appear
          # and persist, the join is stuck at "Waiting for the cluster to join".
          # No anchors (^/$) because the log message may include a container runtime prefix.
          expr: |
            ~"\\.{10,}" and namespace:~"instance-.*" and _time:2m |
            stats by (pod, namespace, cluster, environment) count() as dot_count |
            filter dot_count :> 1
          for: 2m
          labels:
            severity: critical
            cluster: "{{ $labels.cluster }}"
            environment: "{{ $labels.environment }}"
          annotations:
            summary: "Redis cluster join stuck in {{ $labels.pod }} ({{ $labels.namespace }})"
            description: |
              [cluster={{ $labels.cluster }}] Redis cluster join appears stuck in pod '{{ $labels.pod }}' 
              in namespace '{{ $labels.namespace }}'. The cluster creation process is stuck at the 
              "Waiting for the cluster to join" stage, indicating nodes cannot communicate properly.
              Dot count: {{ $value }}.
            view_logs: 'https://grafana.observability{{ if eq $labels.environment "dev" }}.dev{{ end }}.internal.falkordb.cloud/explore?orgId=1&left=%7B%22datasource%22%3A%22VictoriaLogs%22%2C%22queries%22%3A%5B%7B%22expr%22%3A%22pod%3A%5C%22{{ $labels.pod }}%5C%22%20AND%20namespace%3A%5C%22{{ $labels.namespace }}%5C%22%22%7D%5D%7D'

        - alert: RedisCrashLoop
          # LogsQL: Detect Redis crash loop (2+ crashes in last 10 minutes).
          # Uses "=== REDIS BUG REPORT START" as the single anchor — it is emitted exactly once per
          # crash for all crash types. Using an OR with "crashed by signal" caused a single signal
          # crash to match two lines (count=2) and falsely trigger this alert.
          expr: |
            ~"=== REDIS BUG REPORT START" and -pod:~"vmalert*" and _time:10m | 
            stats by (pod, namespace, cluster, environment) count() as crash_count | 
            filter crash_count :>= 2
          for: 1m
          labels:
            severity: critical
            cluster: "{{ $labels.cluster }}"
            environment: "{{ $labels.environment }}"
          annotations:
            summary: "CRITICAL: Redis crash loop detected in {{ $labels.pod }} ({{ $labels.namespace }})"
            description: |
              [cluster={{ $labels.cluster }}] CRITICAL: Redis in pod '{{ $labels.pod }}' in namespace '{{ $labels.namespace }}' 
              is in a crash loop. It has crashed {{ $value }} times in the last 10 minutes.
              This requires immediate attention to prevent service disruption.
            view_logs: 'https://grafana.observability{{ if eq $labels.environment "dev" }}.dev{{ end }}.internal.falkordb.cloud/explore?orgId=1&left=%7B%22datasource%22%3A%22VictoriaLogs%22%2C%22queries%22%3A%5B%7B%22expr%22%3A%22pod%3A%5C%22{{ $labels.pod }}%5C%22%20AND%20namespace%3A%5C%22{{ $labels.namespace }}%5C%22%20AND%20container%3A%5C%22service%5C%22%22%7D%5D%7D'

        - alert: ContainerKilledBySIGABRT
          # LogsQL: Detect intentional SIGABRT (signal 6) sent by our OOM handling automation.
          # When cgroup memory reaches 90%, we send SIGABRT via external kill to get a core dump.
          # This is NOT a Redis bug — suppress RedisCrashed/RedisCrashLoop via inhibit rules.
          # Matching "si_code: 0" (SI_USER) ensures we only catch externally-sent SIGABRT.
          # Redis internal abort() (assertion failure) produces si_code: -6 (SI_TKILL) and
          # will NOT match this alert, correctly falling through to RedisCrashed instead.
          expr: |
            ~"crashed by signal: 6, si_code: 0" and -pod:~"vmalert*" | 
            stats by (pod, namespace, cluster, environment) count() as crash_count    
          for: 0m
          keep_firing_for: 5m
          labels:
            severity: warning
            cluster: "{{ $labels.cluster }}"
            environment: "{{ $labels.environment }}"
          annotations:
            summary: "Container killed by SIGABRT (OOM automation) in {{ $labels.pod }} ({{ $labels.namespace }})"
            description: |
              [cluster={{ $labels.cluster }}] Container in pod '{{ $labels.pod }}' in namespace '{{ $labels.namespace }}' 
              was killed by SIGABRT (signal 6) as part of automated OOM handling. This is an intentional kill 
              triggered when cgroup memory reached 90% to capture diagnostic data (core dump).
              The RedisCrashed alert is suppressed for this event.
            view_logs: 'https://grafana.observability{{ if eq $labels.environment "dev" }}.dev{{ end }}.internal.falkordb.cloud/explore?orgId=1&left=%7B%22datasource%22%3A%22VictoriaLogs%22%2C%22queries%22%3A%5B%7B%22expr%22%3A%22pod%3A%5C%22{{ $labels.pod }}%5C%22%20AND%20namespace%3A%5C%22{{ $labels.namespace }}%5C%22%20AND%20container%3A%5C%22service%5C%22%22%7D%5D%7D'

        - alert: ContainerKilledBySIGABRTLoop
          # LogsQL: Detect repeated external SIGABRT kills (2+ in 10 minutes) — indicates the pod
          # is stuck in an OOM → SIGABRT → restart → OOM cycle and needs manual intervention.
          # Uses si_code: 0 (SI_USER) to only match externally-sent SIGABRT from OOM automation,
          # not internal abort() from genuine Redis/FalkorDB assertion failures.
          expr: |
            ~"crashed by signal: 6, si_code: 0" and -pod:~"vmalert*" and _time:10m | 
            stats by (pod, namespace, cluster, environment) count() as crash_count | 
            filter crash_count :>= 2
          for: 1m
          labels:
            severity: critical
            cluster: "{{ $labels.cluster }}"
            environment: "{{ $labels.environment }}"
          annotations:
            summary: "CRITICAL: Repeated SIGABRT kills (OOM loop) in {{ $labels.pod }} ({{ $labels.namespace }})"
            description: |
              [cluster={{ $labels.cluster }}] CRITICAL: Pod '{{ $labels.pod }}' in namespace '{{ $labels.namespace }}' 
              has been killed by SIGABRT {{ $value }} times in the last 10 minutes. The instance is stuck in an 
              OOM → SIGABRT → restart → OOM loop and requires immediate attention (likely needs a memory scale-up).
            view_logs: 'https://grafana.observability{{ if eq $labels.environment "dev" }}.dev{{ end }}.internal.falkordb.cloud/explore?orgId=1&left=%7B%22datasource%22%3A%22VictoriaLogs%22%2C%22queries%22%3A%5B%7B%22expr%22%3A%22pod%3A%5C%22{{ $labels.pod }}%5C%22%20AND%20namespace%3A%5C%22{{ $labels.namespace }}%5C%22%20AND%20container%3A%5C%22service%5C%22%22%7D%5D%7D'
