name: Renovate

on:
  schedule:
    # Run every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run Renovate
        uses: renovatebot/github-action@693b9ef15eec82123529a37c782242f091365961 # v46.1.14
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          LOG_LEVEL: info
          # Let Renovate install tools (e.g. opentofu) on demand inside its own
          # container via containerbase, so postUpgradeTasks can run `tofu init`.
          RENOVATE_BINARY_SOURCE: install
          # allowedCommands is an admin-only setting; must be passed via env,
          # not via renovate.json. Restrict to the exact command we run from
          # postUpgradeTasks (anchored regex).
          RENOVATE_ALLOWED_COMMANDS: '["^tofu init -upgrade -backend=false -input=false$"]'
