apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-ingress-controller
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    targetRevision: 4.12.1
    chart: ingress-nginx
    helm:
      values: |
        # Expose Wazuh Manager API (TCP/55000) and Wazuh Indexer / OpenSearch
        # (TCP/9200) on the nginx ingress LB. Both speak HTTPS with self-signed
        # certs; nginx just passes the TCP stream through. Used by the AI
        # Security Triage script.
        tcp:
          "55000": "security/wazuh:55000"
          "9200": "security/wazuh-indexer:9200"
        controller:
          replicaCount: 2
          allowSnippetAnnotations: true
          config:
            annotations-risk-level: Critical
          service:
            annotations:
              cloud.google.com/load-balancer-type: "External"
            type: LoadBalancer
            loadBalancerIP: 34.56.192.31
          admissionWebhooks:
            enabled: true
            annotations:
              argocd.argoproj.io/hook: PostSync
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
