apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: victorialogs
  namespace: argocd
spec:
  project: default
  source:
    chart: victoria-logs-single
    repoURL: https://victoriametrics.github.io/helm-charts
    targetRevision: 0.11.5
    helm:
      valuesObject:
        fullnameOverride: "victorialogs"
        server:
          retentionPeriod: 1y
          nodeSelector:
            node_pool: observability
          persistentVolume:
            enabled: true
            size: 1Ti
          resources:
            requests:
              memory: "6Gi"
              cpu: "1500m"
        dashboards:
          enabled: true
          annotations:
            argocd.argoproj.io/sync-options: ServerSideApply=true
          grafanaOperator:
            enabled: true
            spec:
              instanceSelector:
                matchLabels:
                  dashboards: "grafana"
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  ignoreDifferences:
    # PVC size changes must be applied by resizing the live PVC first; Kubernetes forbids
    # patching StatefulSet volumeClaimTemplates after creation.
    - group: apps
      kind: StatefulSet
      name: victorialogs-server
      jsonPointers:
        - /spec/volumeClaimTemplates/0/spec/resources/requests/storage
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    automated:
      prune: true
      selfHeal: true
