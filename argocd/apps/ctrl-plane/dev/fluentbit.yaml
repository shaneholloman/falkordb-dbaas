apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fluentbit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/FalkorDB/falkordb-dbaas.git
    targetRevision: dev
    path: argocd/kustomize/fluentbit/overlays/gke
    kustomize:
      patches:
        - target:
            kind: DaemonSet
            name: fluent-bit
          patch: |-
            - op: replace
              path: /spec/template/spec/containers/0/env/1/value
              value: ctrl-plane-dev
            - op: replace
              path: /spec/template/spec/containers/0/env/2/value
              value: gke
            - op: replace
              path: /spec/template/spec/containers/0/env/3/value
              value: unknown
  destination:
    server: https://kubernetes.default.svc
    namespace: fluent-bit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
