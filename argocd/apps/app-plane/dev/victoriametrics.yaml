apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: victoriametrics
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            role: app-plane
  template:
    metadata:
      name: '{{ regexFind "h?c-[A-Za-z0-9]+" .name }}-victoriametrics'
    spec:
      project: default
      source:
        chart: victoria-metrics-k8s-stack
        repoURL: https://victoriametrics.github.io/helm-charts
        targetRevision: 0.35.1
        helm:
          releaseName: vm
          valuesObject:
            defaultDashboards:
              enabled: true
              annotations:
                argocd.argoproj.io/sync-options: ServerSideApply=true
              dashboards:
                victoriametrics-vmagent:
                  enabled: false
              grafanaOperator:
                enabled: true
                spec:
                  allowCrossNamespaceImport: false
                  instanceSelector:
                    matchLabels:
                      dashboards: grafana
            defaultRules:
              create: false
            victoria-metrics-operator:
              operator:
                disable_prometheus_converter: true
              nodeSelector:
                node_pool: observability
            vmsingle:
              spec:
                retentionPeriod: 3d
                logFormat: json
                nodeSelector:
                  node_pool: observability
                resources:
                  requests:
                    memory: "1Gi"
                    cpu: "80m"
                  limits:
                    memory: "4Gi"
                    cpu: "400m"
                storage:
                  resources:
                    requests:
                      storage: 50Gi
            alertmanager:
              spec:
                resources:
                  requests:
                    memory: "56Mi"
                    cpu: "20m"
                  limits:
                    memory: "256Mi"
                    cpu: "100m"
                nodeSelector:
                  node_pool: observability
                secrets:
                  - pagerduty-service-key
                configSecret: null
              config:
                global:
                  resolve_timeout: 5m
                inhibit_rules:
                  # When ContainerKilledBySIGABRT or its loop variant triggers (intentional OOM automation kill),
                  # suppress RedisCrashed/Loop (it's not a bug) and downstream per-pod alerts.
                  # Scoped to the same pod to avoid hiding crashes on other pods in replicated/cluster deployments.
                  # Uses source_match_re so both the single-event warning (keep_firing_for: 5m) and
                  # the loop alert (10m window) act as inhibition sources — prevents a gap where
                  # the warning resolves but the loop is still active.
                  - source_match_re:
                      alertname: (ContainerKilledBySIGABRT|ContainerKilledBySIGABRTLoop)
                    target_match_re:
                      alertname: (RedisCrashed|RedisCrashLoop|FalkorDBDown|FalkorDBDownLoop|SustainedErrorLogInK8s)
                    equal: ["namespace", "cluster", "pod"]
                  # When RedisCrashed triggers, suppress FalkorDBDown, FalkorDBMultiplePodsDown, FalkorDBDownLoop and SustainedErrorLogInK8s
                  - source_match:
                      alertname: RedisCrashed
                    target_match_re:
                      alertname: (FalkorDBDown|FalkorDBMultiplePodsDown|FalkorDBDownLoop|SustainedErrorLogInK8s)
                    equal: ["namespace", "cluster"]
                  # When namespace-wide multi-pod outage is active, suppress per-pod FalkorDBDown alerts
                  - source_match:
                      alertname: FalkorDBMultiplePodsDown
                    target_match:
                      alertname: FalkorDBDown
                    equal: ["namespace", "cluster", "environment"]
                  # SOC 2 security stack — when a scanner is Failing, suppress its redundant Stale alert
                  - source_match: { alertname: ProwlerScanFailing }
                    target_match: { alertname: ProwlerScanStale }
                  - source_match: { alertname: GrypeScanFailing }
                    target_match: { alertname: GrypeScanStale }
                  - source_match: { alertname: KubeBenchScanFailing }
                    target_match: { alertname: KubeBenchScanStale }
                  - source_match: { alertname: KubescapeScanFailing }
                    target_match: { alertname: KubescapeScanStale }
                  - source_match: { alertname: TrufflehogScanFailing }
                    target_match: { alertname: TrufflehogScanStale }
                  # If CronJob is Suspended, neither Failing nor Stale add information
                  - source_match: { alertname: ProwlerCronJobSuspended }
                    target_match_re: { alertname: 'ProwlerScan(Failing|Stale)' }
                  - source_match: { alertname: GrypeCronJobSuspended }
                    target_match_re: { alertname: 'GrypeScan(Failing|Stale)' }
                  - source_match: { alertname: KubeBenchCronJobSuspended }
                    target_match_re: { alertname: 'KubeBenchScan(Failing|Stale)' }
                  - source_match: { alertname: KubescapeCronJobSuspended }
                    target_match_re: { alertname: 'KubescapeScan(Failing|Stale)' }
                  - source_match: { alertname: TrufflehogCronJobSuspended }
                    target_match_re: { alertname: 'TrufflehogScan(Failing|Stale)' }
                route:
                  group_by: ["alertname", "namespace", "pod"]
                  group_wait: 30s
                  group_interval: 5m
                  repeat_interval: 12h
                  receiver: "pagerduty"
                  routes:
                    - match:
                        alertname: Watchdog
                      receiver: "blackhole"
                    - match:
                        alertname: InfoInhibitor
                      receiver: "blackhole"
                    # SOC 2 security alerts — operational warnings stay in AM UI (no page),
                    # only criticals page. Larger group/repeat intervals reduce noise on
                    # daily-scan failures that don't warrant 12h re-pages.
                    - matchers:
                        - team = security
                        - severity = critical
                      receiver: "pagerduty"
                      group_by: ["alertname", "cluster"]
                      group_wait: 5m
                      group_interval: 30m
                      repeat_interval: 24h
                    - matchers:
                        - team = security
                      receiver: "blackhole"
                      group_by: ["alertname", "cluster"]
                      group_wait: 5m
                      group_interval: 1h
                      repeat_interval: 7d
                    - receiver: "pagerduty"
                receivers:
                  - name: blackhole
                  - name: "pagerduty"
                    pagerduty_configs:
                      - service_key_file: "/etc/vm/secrets/pagerduty-service-key/api-key"
                        url: https://events.pagerduty.com/generic/2010-04-15/create_event.json
                        send_resolved: true
                        client_url: https://grafana.observability.dev.internal.falkordb.cloud/alerting/groups
            vmalert:
              spec:
                nodeSelector:
                  node_pool: observability
                ruleSelector:
                  matchLabels:
                    is_logs: "false"
            vmagent:
              enabled: false
            grafana:
              enabled: false
            prometheus-node-exporter:
              enabled: false
            kube-state-metrics:
              enabled: false
            kubeScheduler:
              enabled: false
            kubelet:
              enabled: false
            kubeApiServer:
              enabled: false
            kubeControllerManager:
              enabled: false
            kubeDns:
              enabled: false
            coreDns:
              enabled: false
            kubeEtcd:
              enabled: false
            enabled:
              enabled: false
            kubeProxy:
              enabled: false
      destination:
        server: "{{.server}}"
        namespace: observability
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - RespectIgnoreDifferences=true
        automated:
          prune: true
          selfHeal: true
      ignoreDifferences:
        - group: ""
          kind: Secret
          name: victoria-metrics-k8s-stack-vm-validation
          namespace: observability
          jsonPointers:
            - /data
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          name: victoria-metrics-k8s-stack-vm-admission
          jqPathExpressions:
            - ".webhooks[]?.clientConfig.caBundle"
