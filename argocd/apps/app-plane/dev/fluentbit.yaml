apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fluentbit
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            role: app-plane
        values:
          cloudProvider: '{{ with index .metadata.labels "cloud_provider" }}{{ . }}{{ else }}unknown{{ end }}'
          providerOverlay: '{{ with index .metadata.labels "cloud_provider" }}{{ if eq . "gcp" }}gke{{ else if eq . "aws" }}eks{{ else if eq . "azure" }}aks{{ else }}unsupported{{ end }}{{ else }}unsupported{{ end }}'
          region: '{{ with index .metadata.labels "region" }}{{ . }}{{ else }}unknown{{ end }}'
  template:
    metadata:
      name: '{{ regexFind "h?c-[A-Za-z0-9]+" .name }}-fluentbit'
    spec:
      project: default
      source:
        repoURL: https://github.com/FalkorDB/falkordb-dbaas.git
        targetRevision: dev
        path: 'argocd/kustomize/fluentbit/overlays/{{ .values.providerOverlay }}'
        kustomize:
          patches:
            - target:
                kind: DaemonSet
                name: fluent-bit
              patch: |-
                apiVersion: apps/v1
                kind: DaemonSet
                metadata:
                  name: fluent-bit
                spec:
                  template:
                    spec:
                      containers:
                        - name: fluent-bit
                          env:
                            - name: CLUSTER_NAME
                              value: '{{ regexFind "h?c-[A-Za-z0-9]+" .name }}'
                            - name: CLOUD_PROVIDER
                              value: '{{ .values.cloudProvider }}'
                            - name: CLOUD_REGION
                              value: '{{ .values.region }}'
      destination:
        server: "{{.server}}"
        namespace: fluent-bit
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
