# Cloud Evidence Collector — deployed to all AWS app-plane clusters via ApplicationSet.
# Collects AWS IAM/EKS evidence and uploads to the central GCS evidence locker.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: cloud-evidence
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            role: app-plane
            cloud_provider: aws
  template:
    metadata:
      name: '{{ regexFind "h?c-[A-Za-z0-9]+" .name }}-cloud-evidence'
    spec:
      project: default
      source:
        repoURL: https://github.com/FalkorDB/falkordb-dbaas.git
        targetRevision: dev
        path: argocd/kustomize/cloud-evidence/overlays/aws-dev
      destination:
        server: "{{.server}}"
        namespace: security
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          prune: true
          selfHeal: true
