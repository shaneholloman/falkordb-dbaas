apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ldap-auth

resources:
  - ../../base/
  - https://github.com/FalkorDB/ldap-auth-rs.git//k8s/overlays/production

patches:
  - target:
      kind: Deployment
      name: ldap-auth-rs
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: "docker.io/falkordb/ldap-auth-rs:0.4.2"
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node_pool: observability
      # Move LDAP listening port off 3389 because subnet NACLs deny TCP/3389
      # (RDP hardening) cluster-wide. ldap-auth-rs listens on a single port
      # with TLS auto-detection, so binding to 3390 is fine. Service ports
      # remain 3389/3390 and both forward to this targetPort (by name 'ldap'),
      # so clients keep working unchanged. ports[1] is the 'ldap' port
      # (ports[0] is 'http' 8080).
      - op: replace
        path: /spec/template/spec/containers/0/ports/1/containerPort
        value: 3390
  - target:
      kind: StatefulSet
      name: redis
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node_pool: observability
  - target:
      kind: StatefulSet
      name: redis-replica
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          node_pool: observability
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/component: cache
                    app.kubernetes.io/part-of: ldap-auth
                topologyKey: kubernetes.io/hostname
  - target:
      kind: HorizontalPodAutoscaler
      name: ldap-auth-hpa
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 2
      - op: replace
        path: /spec/maxReplicas
        value: 3
  - target:
      kind: ConfigMap
      name: ldap-auth-config
    patch: |-
      - op: replace
        path: /data/LDAP_BASE_DN
        value: "dc=falkordb,dc=cloud"
      - op: replace
        path: /data/LDAP_SEARCH_BIND_ORG
        value: "admin"
      # Pod binds LDAP on 3390 to avoid NACL deny TCP/3389. Service ports
      # 3389/3390 both forward to this port.
      - op: replace
        path: /data/LDAP_PORT
        value: "3390"
  - target:
      kind: StringSecret
      name: ldap-auth-secrets
    patch: |-
      - op: replace
        path: /spec/fields/1/encoding
        value: base64url
  - target:
      kind: Certificate
      name: ldap-auth-tls-cert
    patch: |-
      - op: add
        path: /spec/dnsNames/-
        value: "localhost"
  - target:
      kind: Service
      name: ldap-auth-service
    patch: |-
      - op: add
        path: /spec/ports/-
        value:
          name: ldaps
          port: 3390
          targetPort: ldap
          protocol: TCP
  - target:
      kind: Service
      name: ldap-auth-headless
    patch: |-
      - op: add
        path: /spec/ports/-
        value:
          name: ldaps
          port: 3390
          targetPort: ldap
          protocol: TCP

patchesStrategicMerge:
  - |-
    apiVersion: monitoring.coreos.com/v1
    kind: ServiceMonitor
    metadata:
      name: ldap-auth-metrics
    $patch: delete
