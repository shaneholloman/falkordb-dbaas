# Custom Wazuh integration script for Google Chat webhooks.
# Deployed as a ConfigMap and mounted into the Wazuh Manager at
# /var/ossec/integrations/custom-google-chat
#
# Wazuh calls this script with:
#   argv[1] = alert file path (JSON)
#   argv[2] = API key (not used — webhook URL is passed via hook_url)
#   argv[3] = hook_url
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-google-chat-integration
  namespace: security
  labels:
    app: wazuh
    component: integration
data:
  custom-google-chat: |
    #!/usr/bin/env python3
    """Wazuh custom integration: forward alerts to Google Chat via webhook.

    Rate-limited: at most RATE_LIMIT_MAX messages per RATE_LIMIT_WINDOW
    seconds (sliding window). State persisted at RATE_LIMIT_STATE.
    Critical alerts (level >= 13) bypass the cap so genuine incidents are
    never dropped. When the cap is hit, drops are logged to stderr (which
    Wazuh tee's to ossec.log) and an aggregate "rate-limit hit" message
    is posted to Google Chat at most once per window.
    """
    import json
    import os
    import sys
    import time
    import fcntl
    import urllib.request
    import urllib.error

    ALERT_FILE = sys.argv[1]
    # Read the webhook URL from the mounted secret file (preferred),
    # then try env var, then the ossec.conf hook_url arg.
    SECRET_PATH = "/var/ossec/etc/secrets/google-chat/WAZUH_GOOGLE_CHAT_WEBHOOK_URL"
    _arg_url = sys.argv[3] if len(sys.argv) > 3 else ""
    HOOK_URL = ""
    if os.path.isfile(SECRET_PATH):
        with open(SECRET_PATH) as _sf:
            HOOK_URL = _sf.read().strip()
    if not HOOK_URL:
        HOOK_URL = os.environ.get("WAZUH_GOOGLE_CHAT_WEBHOOK_URL") or _arg_url
    if not HOOK_URL or HOOK_URL == "FROM_SECRET":
        print("ERROR: No webhook URL provided", file=sys.stderr)
        sys.exit(1)

    # ── Rate limiting ─────────────────────────────────────────────
    # Sliding window: at most MAX msgs in WINDOW seconds. Critical
    # alerts (level >= BYPASS_LEVEL) ignore the cap.
    RATE_LIMIT_STATE = os.environ.get(
        "WAZUH_GCHAT_RL_STATE", "/var/ossec/logs/gchat-rate-limit.json"
    )
    RATE_LIMIT_WINDOW = int(os.environ.get("WAZUH_GCHAT_RL_WINDOW", "3600"))
    RATE_LIMIT_MAX = int(os.environ.get("WAZUH_GCHAT_RL_MAX", "50"))
    RATE_LIMIT_BYPASS_LEVEL = int(os.environ.get("WAZUH_GCHAT_RL_BYPASS", "13"))

    def _post(payload_dict):
        body = json.dumps(payload_dict).encode("utf-8")
        req = urllib.request.Request(
            HOOK_URL,
            data=body,
            headers={"Content-Type": "application/json; charset=UTF-8"},
            method="POST",
        )
        try:
            with urllib.request.urlopen(req, timeout=10) as resp:
                if resp.status not in (200, 201):
                    print(
                        f"WARNING: Google Chat returned status {resp.status}",
                        file=sys.stderr,
                    )
                    return False
                return True
        except urllib.error.URLError as e:
            print(f"ERROR: Failed to post to Google Chat: {e}", file=sys.stderr)
            return False

    def _check_rate_limit(level):
        """Return (allowed: bool, dropped_since: int).

        Critical alerts always allowed. Returns dropped_since > 0 when this
        invocation is the first to allow a message after one or more drops
        in the current window — caller should then post an aggregate notice.
        """
        if level >= RATE_LIMIT_BYPASS_LEVEL:
            return True, 0
        now = time.time()
        os.makedirs(os.path.dirname(RATE_LIMIT_STATE), exist_ok=True)
        # Open with O_RDWR | O_CREAT for fcntl locking.
        fd = os.open(RATE_LIMIT_STATE, os.O_RDWR | os.O_CREAT, 0o640)
        try:
            fcntl.flock(fd, fcntl.LOCK_EX)
            try:
                raw = os.read(fd, 65536).decode("utf-8") or "{}"
                state = json.loads(raw) if raw.strip() else {}
            except (json.JSONDecodeError, UnicodeDecodeError):
                state = {}
            timestamps = [
                t for t in state.get("timestamps", [])
                if isinstance(t, (int, float)) and (now - t) < RATE_LIMIT_WINDOW
            ]
            dropped = int(state.get("dropped", 0))
            if len(timestamps) >= RATE_LIMIT_MAX:
                state["timestamps"] = timestamps
                state["dropped"] = dropped + 1
                os.lseek(fd, 0, 0)
                os.ftruncate(fd, 0)
                os.write(fd, json.dumps(state).encode("utf-8"))
                print(
                    f"WARN: Google Chat rate limit hit "
                    f"({len(timestamps)}/{RATE_LIMIT_MAX} in {RATE_LIMIT_WINDOW}s); "
                    f"dropped this alert (level={level}, total dropped={dropped + 1}).",
                    file=sys.stderr,
                )
                return False, 0
            timestamps.append(now)
            state["timestamps"] = timestamps
            # Reset dropped counter once we successfully allow a message
            # again — return the previous count so caller can announce it.
            announce = dropped
            state["dropped"] = 0
            os.lseek(fd, 0, 0)
            os.ftruncate(fd, 0)
            os.write(fd, json.dumps(state).encode("utf-8"))
            return True, announce
        finally:
            try:
                fcntl.flock(fd, fcntl.LOCK_UN)
            finally:
                os.close(fd)

    with open(ALERT_FILE) as f:
        alert = json.load(f)

    rule = alert.get("rule", {})
    agent = alert.get("agent", {})
    data = alert.get("data", {})
    level = rule.get("level", 0)

    allowed, dropped_since = _check_rate_limit(level)
    if not allowed:
        # Drop silently — counter persisted; aggregate posted on next allow.
        sys.exit(0)

    # ── Environment detection ─────────────────────────────────
    # Derive environment from Cluster field or hostname in predecoder.
    env_name = os.environ.get("WAZUH_ENVIRONMENT", "")
    if not env_name:
        cluster_name = data.get("Cluster") or data.get("ClusterName") or ""
        hostname = alert.get("predecoder", {}).get("hostname", "")
        candidate = cluster_name or hostname
        if "prod" in candidate.lower():
            env_name = "PROD"
        elif "stag" in candidate.lower():
            env_name = "STAGING"
        else:
            env_name = "DEV"

    # ── Dashboard link ────────────────────────────────────────
    # Build a direct link to the Wazuh dashboard filtered on this alert's rule.
    DASHBOARD_BASE = os.environ.get(
        "WAZUH_DASHBOARD_URL",
        "https://wazuh.security.dev.internal.falkordb.cloud"
    )
    alert_id = alert.get("id", "")
    rule_id = rule.get("id", "")
    # Link to Discover view filtered by rule.id
    dashboard_link = (
        f"{DASHBOARD_BASE}/app/discover#/?"
        f"_a=(query:(language:lucene,query:'rule.id:{rule_id}'))"
    )

    # Map severity to emoji
    if level >= 13:
        icon = "🔴"
    elif level >= 10:
        icon = "🟠"
    elif level >= 7:
        icon = "🟡"
    else:
        icon = "🔵"

    # ── Build scanner-specific detail lines ───────────────────
    detail_lines = []
    scanner = data.get("Scanner", "")

    if scanner == "prowler":
        check = data.get("CheckTitle", "")
        status_ext = data.get("StatusExtended", "")
        resource = data.get("ResourceId", "")
        service = data.get("ServiceName", "")
        region = data.get("Region", "")
        detail_lines.append(f"*Check:* {check}")
        if status_ext:
            detail_lines.append(f"*Finding:* {status_ext}")
        if resource:
            detail_lines.append(f"*Resource:* {resource}")
        if service:
            detail_lines.append(f"*Service:* {service}")
        if region:
            detail_lines.append(f"*Region:* {region}")

    elif scanner == "trufflehog":
        detector = data.get("DetectorName", "")
        image = data.get("ImageName", "")
        verified = data.get("Verified", "")
        source_id = data.get("SourceID", "")
        detail_lines.append(f"*Detector:* {detector}")
        if image:
            detail_lines.append(f"*Image:* {image}")
        detail_lines.append(f"*Verified:* {verified}")
        if source_id:
            detail_lines.append(f"*Source:* {source_id}")

    elif scanner == "kube-bench":
        test_num = data.get("TestNumber", "")
        test_desc = data.get("TestDesc", "")
        section = data.get("SectionDesc", "")
        status = data.get("Status", "")
        scored = data.get("Scored", "")
        if test_num:
            detail_lines.append(f"*Test:* [{test_num}] {test_desc}")
        if section:
            detail_lines.append(f"*Section:* {section}")
        if status:
            detail_lines.append(f"*Status:* {status} (scored: {scored})")

    elif scanner == "kubescape":
        ctrl_id = data.get("ControlID", "")
        ctrl_name = data.get("ControlName", "")
        framework = data.get("Framework", "")
        severity = data.get("Severity", "")
        if ctrl_id:
            detail_lines.append(f"*Control:* [{ctrl_id}] {ctrl_name}")
        if framework:
            detail_lines.append(f"*Framework:* {framework}")
        if severity:
            detail_lines.append(f"*Severity:* {severity}")

    elif scanner == "grype":
        vuln_id = data.get("VulnerabilityID", "")
        pkg = data.get("Package", "")
        image = data.get("ImageName", "")
        severity = data.get("Severity", "")
        version = data.get("InstalledVersion", "")
        if vuln_id:
            detail_lines.append(f"*CVE:* {vuln_id}")
        if pkg:
            detail_lines.append(f"*Package:* {pkg} ({version})")
        if image:
            detail_lines.append(f"*Image:* {image}")
        if severity:
            detail_lines.append(f"*Severity:* {severity}")

    # Fallback: if no scanner-specific fields, show rule description
    if not detail_lines:
        desc = rule.get("description", "")
        if desc:
            detail_lines.append(f"*Details:* {desc}")

    # ── Compose message ──────────────────────────────────────
    cluster_display = data.get("Cluster") or data.get("ClusterName") or ""

    text = (
        f"{icon} *Wazuh Alert — Level {level}* | `{env_name}`\n"
        f"*Rule:* {rule_id} — {rule.get('description', 'No description')}\n"
    )
    if cluster_display:
        text += f"*Cluster:* {cluster_display}\n"
    text += f"*Groups:* {', '.join(rule.get('groups', []))}\n"

    if detail_lines:
        text += "\n".join(detail_lines) + "\n"

    text += f"\n<{dashboard_link}|🔍 View in Dashboard>"

    if dropped_since > 0:
        text = (
            f"⚠️ *Rate-limit recovery* — {dropped_since} alert(s) were dropped "
            f"in the previous {RATE_LIMIT_WINDOW}s window (cap: "
            f"{RATE_LIMIT_MAX}/window). Resuming delivery.\n\n"
        ) + text

    # Truncate to stay within Google Chat's 4096-char limit
    if len(text) > 4000:
        text = text[:3990] + "\n…(truncated)"

    if not _post({"text": text}):
        sys.exit(1)
  custom-google-chat.py: |
    #!/usr/bin/env python3
    # Symlink target — Wazuh looks for both custom-<name> and custom-<name>.py
    import importlib, sys
    sys.argv[0] = sys.argv[0].replace('.py', '')
    exec(open(sys.argv[0]).read())
