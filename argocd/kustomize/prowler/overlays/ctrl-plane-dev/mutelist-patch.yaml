# Prowler mutelist patch — dev-accepted checks excluded from compliance
# scoring because they are cost-prohibitive or not applicable to dev.
# Last reviewed: 2026-05-17
apiVersion: v1
kind: ConfigMap
metadata:
  name: prowler-mutelist
  namespace: security
data:
  mutelist.yaml: |
    # Prowler Mutelist — ctrl-plane-dev accepted-risk checks
    # Last reviewed: 2026-05-17
    Mutelist:
      Accounts:
        "*":
          Checks:
            # ── GCP hardening: not cost-effective for dev ──────────────────
            compute_instance_confidential_computing_enabled:
              Regions:
                - "*"
              Resources:
                - "*"
              Reason: "Cost-prohibitive for dev environment. Enabled in prod."

            compute_instance_disk_encrypted_with_csek:
              Regions:
                - "*"
              Resources:
                - "*"
              Reason: "Using GCP-managed CMEK. CSEK not required for dev."

            compute_instance_block_project_ssh_keys_enabled:
              Regions:
                - "*"
              Resources:
                - "*"
              Reason: "GKE nodes are not SSH-accessible. OS Login not applicable."

            compute_network_subnet_flow_logs_enabled:
              Regions:
                - "*"
              Resources:
                - "*"
              Reason: "Cost vs value not justified for dev. Enabled in prod."

            clouddns_zone_logging_enabled:
              Regions:
                - "*"
              Resources:
                - "*"
              Reason: "Low value for dev. Enabled in prod."

            compute_instance_oslogin_enabled:
              Regions:
                - "*"
              Resources:
                - "*"
              Reason: "GKE-only project, no VM SSH access needed."

            # ── GCP audit log metric filters ──────────────────────────────
            # Dev uses Wazuh+VictoriaMetrics for alerting instead of GCP metrics.
            logging_metric_filter_and_alert_for_project_ownership:
              Regions:
                - "*"
              Resources:
                - "*"
              Reason: "Monitored via Wazuh audit rules instead of GCP metrics."

            logging_metric_filter_and_alert_for_audit_config_changes:
              Regions:
                - "*"
              Resources:
                - "*"
              Reason: "Monitored via Wazuh audit rules instead of GCP metrics."

            logging_metric_filter_and_alert_for_cloud_storage_iam_changes:
              Regions:
                - "*"
              Resources:
                - "*"
              Reason: "Monitored via Wazuh audit rules instead of GCP metrics."

            logging_metric_filter_and_alert_for_custom_role_changes:
              Regions:
                - "*"
              Resources:
                - "*"
              Reason: "Monitored via Wazuh audit rules instead of GCP metrics."

            logging_metric_filter_and_alert_for_sql_instance_config_changes:
              Regions:
                - "*"
              Resources:
                - "*"
              Reason: "Monitored via Wazuh audit rules instead of GCP metrics."

            logging_metric_filter_and_alert_for_vpc_network_changes:
              Regions:
                - "*"
              Resources:
                - "*"
              Reason: "Monitored via Wazuh audit rules instead of GCP metrics."

            logging_metric_filter_and_alert_for_vpc_network_firewall_rule_changes:
              Regions:
                - "*"
              Resources:
                - "*"
              Reason: "Monitored via Wazuh audit rules instead of GCP metrics."

            logging_metric_filter_and_alert_for_vpc_network_route_changes:
              Regions:
                - "*"
              Resources:
                - "*"
              Reason: "Monitored via Wazuh audit rules instead of GCP metrics."
