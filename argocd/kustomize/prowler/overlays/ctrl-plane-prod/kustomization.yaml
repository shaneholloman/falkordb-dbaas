apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security
resources:
  - ../../base
  - secrets-env-secret.yaml
  - azure-credentials-env-secret.yaml
components:
  - ../../components/aws
  - ../../components/azure
configMapGenerator:
  - name: prowler-config
    behavior: create
    literals:
      - cloud-provider=gcp
      - cluster-name=ctrl-plane-prod
      - compliance=cis_2.0_gcp
      - gcp-project-id=ctrl-plane-prod-b1b92df2
      - wazuh-syslog-host=wazuh.security.svc.cluster.local
      - aws-target-name=app-plane-aws-prod
      - aws-role-arn=arn:aws:iam::119146126346:role/security/prowler-soc2-scanner
      - aws-region=us-east-1
      - azure-target-name=app-plane-azure-prod
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: wi-patch.yaml
