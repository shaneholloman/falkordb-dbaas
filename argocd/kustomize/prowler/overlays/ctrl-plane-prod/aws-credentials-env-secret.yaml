---
# AWS credentials for Prowler cross-account scanning.
# role-arn: ARN of prowler-soc2-scanner in the prod app-plane AWS account.
# region: default region for API calls.
# Sealed with ctrl-plane-prod sealed-secrets key.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: prowler-aws-credentials
  namespace: security
spec:
  encryptedData:
    role-arn: PLACEHOLDER_SEALED_VALUE
    access-key-id: PLACEHOLDER_SEALED_VALUE
    secret-access-key: PLACEHOLDER_SEALED_VALUE
    region: PLACEHOLDER_SEALED_VALUE
  template:
    metadata:
      name: prowler-aws-credentials
      namespace: security
