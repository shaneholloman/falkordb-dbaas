---
# Azure SP credentials for Prowler compliance scanning.
# Sealed with ctrl-plane-prod sealed-secrets key.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: prowler-azure-credentials
  namespace: security
spec:
  encryptedData:
    client-id: PLACEHOLDER_SEALED_VALUE
    client-secret: PLACEHOLDER_SEALED_VALUE
    tenant-id: PLACEHOLDER_SEALED_VALUE
    subscription-id: PLACEHOLDER_SEALED_VALUE
  template:
    metadata:
      name: prowler-azure-credentials
      namespace: security
