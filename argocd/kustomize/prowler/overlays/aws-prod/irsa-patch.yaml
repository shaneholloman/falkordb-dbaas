# Annotate the prowler ServiceAccount with the IRSA role ARN
# so EKS can inject AWS credentials via projected service account token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prowler
  namespace: security
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::REPLACE_WITH_PROD_AWS_ACCOUNT_ID:role/security/prowler-soc2-scanner
