# Prowler CronJob for scanning Azure subscription from ctrl-plane.
# Uses Azure SP credentials stored in a SealedSecret.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prowler-soc2-scan-azure
  namespace: security
spec:
  schedule: "30 2 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: prowler
            component: soc2-evidence
            cloud: azure
        spec:
          serviceAccountName: prowler
          restartPolicy: Never
          nodeSelector:
            node_pool: security
          tolerations:
            - key: cloud.google.com/gke-spot
              operator: Equal
              value: "true"
              effect: NoSchedule
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: prowler-tmp
              emptyDir: {}
            - name: mutelist
              configMap:
                name: prowler-mutelist
          containers:
            - name: prowler
              image: toniblyx/prowler:4.6.1@sha256:04bbabd0a66bc0e9d68b3065524ad36df8c2886aab9bbbfef2f80464b026d2b1
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: prowler-tmp
                  mountPath: /tmp
                - name: mutelist
                  mountPath: /etc/prowler
                  readOnly: true
              env:
                - name: EVIDENCE_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: prowler-infra
                      key: evidence-bucket
                - name: CLOUD_PROVIDER
                  value: azure
                - name: CLUSTER_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: prowler-config
                      key: azure-target-name
                - name: COMPLIANCE
                  value: cis_2.0_azure
                - name: AZURE_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: prowler-azure-credentials
                      key: client-id
                - name: AZURE_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: prowler-azure-credentials
                      key: client-secret
                - name: AZURE_TENANT_ID
                  valueFrom:
                    secretKeyRef:
                      name: prowler-azure-credentials
                      key: tenant-id
                - name: AZURE_SUBSCRIPTION_ID
                  valueFrom:
                    secretKeyRef:
                      name: prowler-azure-credentials
                      key: subscription-id
                - name: WAZUH_SYSLOG_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: prowler-config
                      key: wazuh-syslog-host
                      optional: true
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  DATE_PATH=$(date -u +%Y/%m/%d)
                  OUTPUT_DIR="/tmp/prowler-output"
                  mkdir -p "$OUTPUT_DIR"

                  # Run Prowler compliance scan
                  set +e
                  prowler azure \
                    --compliance "$COMPLIANCE" \
                    --output-formats json-ocsf csv \
                    --output-directory "$OUTPUT_DIR" \
                    --mutelist /etc/prowler/mutelist.yaml \
                    --sp-env-auth \
                    --ignore-exit-code-3 \
                    --verbose
                  PROWLER_EXIT=$?
                  set -e

                  # Upload results to the central GCS evidence locker
                  pip install --quiet --no-cache-dir --target /tmp/pip-packages google-cloud-storage
                  export PYTHONPATH="/tmp/pip-packages:${PYTHONPATH:-}"

                  export DATE_PATH OUTPUT_DIR
                  export CLOUD_PROVIDER=azure
                  python3 <<'PYEOF'
                  import os, glob
                  from google.cloud import storage
                  bucket_name = os.environ['EVIDENCE_BUCKET']
                  cloud = os.environ['CLOUD_PROVIDER']
                  cluster = os.environ['CLUSTER_NAME']
                  date_path = os.environ['DATE_PATH']
                  output_dir = os.environ['OUTPUT_DIR']
                  prefix = f'prowler/{date_path}/{cloud}-{cluster}'
                  client = storage.Client()
                  bucket = client.bucket(bucket_name)
                  for f in glob.glob(os.path.join(output_dir, '**', '*'), recursive=True):
                      if os.path.isfile(f):
                          rel = os.path.relpath(f, output_dir)
                          blob = bucket.blob(prefix + '/' + rel)
                          blob.upload_from_filename(f)
                          print(f'Uploaded {rel}')
                  PYEOF

                  echo "Prowler Azure scan complete."
                  exit $PROWLER_EXIT
