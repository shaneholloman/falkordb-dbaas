# Prowler CronJob for scanning Azure subscription from ctrl-plane.
# Uses Azure SP credentials stored in a SealedSecret.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: prowler-soc2-scan-azure
  namespace: security
spec:
  schedule: "30 2 * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app: prowler
            component: soc2-evidence
            cloud: azure
        spec:
          serviceAccountName: prowler
          restartPolicy: Never
          nodeSelector:
            node_pool: security
          tolerations:
            - key: cloud.google.com/gke-spot
              operator: Equal
              value: "true"
              effect: NoSchedule
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: prowler-tmp
              emptyDir: {}
            - name: mutelist
              configMap:
                name: prowler-mutelist
          containers:
            - name: prowler
              image: toniblyx/prowler:4.6.1@sha256:04bbabd0a66bc0e9d68b3065524ad36df8c2886aab9bbbfef2f80464b026d2b1
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1Gi"
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: prowler-tmp
                  mountPath: /tmp
                - name: mutelist
                  mountPath: /etc/prowler
                  readOnly: true
              env:
                - name: EVIDENCE_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: prowler-infra
                      key: evidence-bucket
                - name: CLOUD_PROVIDER
                  value: azure
                - name: CLUSTER_NAME
                  valueFrom:
                    configMapKeyRef:
                      name: prowler-config
                      key: azure-target-name
                - name: COMPLIANCE
                  value: cis_2.0_azure
                - name: AZURE_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      name: prowler-azure-credentials
                      key: client-id
                - name: AZURE_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: prowler-azure-credentials
                      key: client-secret
                - name: AZURE_TENANT_ID
                  valueFrom:
                    secretKeyRef:
                      name: prowler-azure-credentials
                      key: tenant-id
                - name: AZURE_SUBSCRIPTION_ID
                  valueFrom:
                    secretKeyRef:
                      name: prowler-azure-credentials
                      key: subscription-id
                - name: WAZUH_SYSLOG_HOST
                  valueFrom:
                    configMapKeyRef:
                      name: prowler-config
                      key: wazuh-syslog-host
                      optional: true
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  DATE_PATH=$(date -u +%Y/%m/%d)
                  OUTPUT_DIR="/tmp/prowler-output"
                  mkdir -p "$OUTPUT_DIR"

                  # Run Prowler compliance scan
                  set +e
                  prowler azure \
                    --compliance "$COMPLIANCE" \
                    --output-formats json-ocsf csv \
                    --output-directory "$OUTPUT_DIR" \
                    --mutelist /etc/prowler/mutelist.yaml \
                    --sp-env-auth \
                    --ignore-exit-code-3 \
                    --verbose
                  PROWLER_EXIT=$?
                  set -e

                  # Upload results to the central GCS evidence locker
                  pip install --quiet --no-cache-dir --target /tmp/pip-packages google-cloud-storage
                  export PYTHONPATH="/tmp/pip-packages:${PYTHONPATH:-}"

                  export DATE_PATH OUTPUT_DIR
                  export CLOUD_PROVIDER=azure
                  python3 <<'PYEOF'
                  import os, glob
                  from google.cloud import storage
                  bucket_name = os.environ['EVIDENCE_BUCKET']
                  cloud = os.environ['CLOUD_PROVIDER']
                  cluster = os.environ['CLUSTER_NAME']
                  date_path = os.environ['DATE_PATH']
                  output_dir = os.environ['OUTPUT_DIR']
                  prefix = f'prowler/{date_path}/{cloud}-{cluster}'
                  client = storage.Client()
                  bucket = client.bucket(bucket_name)
                  for f in glob.glob(os.path.join(output_dir, '**', '*'), recursive=True):
                      if os.path.isfile(f):
                          rel = os.path.relpath(f, output_dir)
                          blob = bucket.blob(prefix + '/' + rel)
                          blob.upload_from_filename(f)
                          print(f'Uploaded {rel}')
                  PYEOF

                  echo "Prowler Azure scan complete. Results uploaded to GCS."

                  # Forward FAIL findings to Wazuh Manager via TCP syslog
                  python3 <<'SYSLOG_EOF'
                  import os, glob, json, socket, time

                  syslog_host = os.environ.get('WAZUH_SYSLOG_HOST', '')
                  syslog_port = 514
                  if not syslog_host:
                      print('WAZUH_SYSLOG_HOST not set, skipping syslog forwarding')
                      exit(0)

                  output_dir = os.environ['OUTPUT_DIR']
                  cluster = os.environ['CLUSTER_NAME']

                  json_files = sorted(
                      glob.glob(os.path.join(output_dir, '**', '*.ocsf.json'), recursive=True)
                  )
                  if not json_files:
                      print('No OCSF JSON files found, skipping syslog')
                      exit(0)

                  findings = []
                  for f in json_files:
                      with open(f) as fh:
                          data = json.load(fh)
                      if isinstance(data, list):
                          findings.extend(data)
                      elif isinstance(data, dict):
                          findings.append(data)

                  fail_count = 0
                  try:
                      sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                      sock.settimeout(10)
                      last_err = None
                      for attempt in range(5):
                          try:
                              sock.connect((syslog_host, syslog_port))
                              last_err = None
                              break
                          except (ConnectionRefusedError, OSError) as ce:
                              last_err = ce
                              try: sock.close()
                              except Exception: pass
                              sock = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                              sock.settimeout(10)
                              time.sleep(2 ** attempt)
                      if last_err is not None:
                          raise last_err
                      for finding in findings:
                          if not isinstance(finding, dict):
                              continue
                          status_code = str(finding.get('status_code', ''))
                          if status_code.upper() != 'FAIL':
                              continue
                          resources_0 = {}
                          res = finding.get('resources')
                          if isinstance(res, list) and res and isinstance(res[0], dict):
                              resources_0 = res[0]
                          sev = finding.get('severity', '')
                          severity_str = sev if isinstance(sev, str) else (sev.get('name', '') if isinstance(sev, dict) else '')
                          mapped = {
                              'Scanner': 'prowler',
                              'Status': 'FAIL',
                              'Provider': (finding.get('cloud') or {}).get('provider', 'azure'),
                              'CheckTitle': (finding.get('finding_info') or {}).get('title', ''),
                              'CheckID': (finding.get('finding_info') or {}).get('uid', ''),
                              'Severity': severity_str,
                              'StatusExtended': str(finding.get('status_detail', finding.get('message', ''))),
                              'ServiceName': (resources_0.get('group') or {}).get('name', '') or resources_0.get('type', ''),
                              'ResourceId': resources_0.get('uid', ''),
                              'Region': resources_0.get('region', ''),
                              'Cluster': cluster,
                          }
                          ts = time.strftime('%b %d %H:%M:%S')
                          msg = '<134>{} {} prowler: {}\n'.format(ts, cluster, json.dumps(mapped, separators=(',', ':')))
                          sock.sendall(msg.encode())
                          fail_count += 1
                      sock.close()
                      print(f'Forwarded {fail_count} FAIL findings to Wazuh at {syslog_host}:{syslog_port}')
                  except Exception as e:
                      print(f'WARNING: Syslog forwarding failed: {e}')
                      print('Scan and GCS upload succeeded; syslog is best-effort.')
                  SYSLOG_EOF

                  exit $PROWLER_EXIT
