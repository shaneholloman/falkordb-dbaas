apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: fluent-bit
data:
  provider-extra.conf: |
    [INPUT]
        Name              tail
        Tag               kube.system.var.log.containers.*
        Path              /var/log/containers/*_kube-system_*.log
        Parser            cri
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_eks_system_containers.db
        Skip_Long_Lines   On
        Refresh_Interval  5
        Rotate_Wait       30
        Path_Key          source_path

    [INPUT]
        Name              tail
        Tag               node.dmesg
        Path              /var/log/dmesg
        Parser            syslog
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_eks_dmesg.db
        Skip_Long_Lines   On

    [INPUT]
        Name              systemd
        Tag               node.docker
        Systemd_Filter    _SYSTEMD_UNIT=docker.service
        Read_From_Tail    On

    [INPUT]
        Name              tail
        Tag               cni.aws-vpc
        Path              /var/log/aws-routed-eni/*.log
        Parser            aws_cni_json
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_eks_aws_routed_eni.db
        Skip_Long_Lines   On

    [INPUT]
        Name              tail
        Tag               cni.aws-plugin
        Path              /var/log/amazon/*.log
        Parser            aws_cni_json
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_eks_amazon_cni.db
        Skip_Long_Lines   On

    [FILTER]
        Name                kubernetes
        Match               kube.system.var.log.containers.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.system.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log
        Labels              On
        Annotations         Off
        Buffer_Size         1MB

    [FILTER]
        Name                modify
        Match               kube.system.var.log.containers.*
        Add                 log_type system
        Add                 source system-namespace

    [FILTER]
        Name                modify
        Match               node.docker
        Add                 source docker

    [FILTER]
        Name                modify
        Match               node.dmesg
        Add                 source kernel

    [FILTER]
        Name                modify
        Match               cni.aws-vpc
        Add                 source aws-vpc-cni
        Add                 log_type cni
        Add                 workload node
        Add                 namespace kube-system
        Add                 pod n/a
        Add                 container n/a

    [FILTER]
        Name                modify
        Match               cni.aws-plugin
        Add                 source aws-cni-plugin
        Add                 log_type cni
        Add                 workload node
        Add                 namespace kube-system
        Add                 pod n/a
        Add                 container n/a
