apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: fluent-bit
data:
  provider-extra.conf: |
    [INPUT]
        Name              tail
        Tag               kube.system.var.log.containers.*
        Path              /var/log/containers/*_kube-system_*.log
        Parser            cri
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_aks_system_containers.db
        Skip_Long_Lines   On
        Refresh_Interval  5
        Rotate_Wait       30
        Path_Key          source_path

    [INPUT]
        Name              tail
        Tag               node.kern
        Path              /var/log/kern.log
        Parser            syslog
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_aks_kern.db
        Skip_Long_Lines   On

    [INPUT]
        Name              tail
        Tag               cni.aks-network
        Path              /var/log/azure-vnet.log,/var/log/azure-vnet-ipam.log,/var/log/azure-cni*.log,/var/log/azure/cni/*.log
        Parser            syslog
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_aks_network.db
        Skip_Long_Lines   On

    [FILTER]
        Name                kubernetes
        Match               kube.system.var.log.containers.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.system.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log
        Labels              On
        Annotations         Off
        Buffer_Size         1MB

    [FILTER]
        Name                modify
        Match               kube.system.var.log.containers.*
        Add                 log_type system
        Add                 source system-namespace

    [FILTER]
        Name                modify
        Match               node.kern
        Add                 source kernel

    [FILTER]
        Name                modify
        Match               cni.aks-network
        Add                 source aks-cni
        Add                 log_type cni
        Add                 workload node
        Add                 namespace kube-system
        Add                 pod n/a
        Add                 container n/a
