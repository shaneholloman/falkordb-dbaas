apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: fluent-bit
data:
  inputs-common.conf: |
    [INPUT]
        Name              tail
        Tag               kube.var.log.containers.*
        Path              /var/log/containers/*.log
        # Exclude system namespaces handled by the GKE overlay to avoid duplicate ingestion.
        Exclude_Path      /var/log/containers/*_kube-system_*.log,/var/log/containers/*_gke-system_*.log,/var/log/containers/*_gmp-system_*.log,/var/log/containers/*_istio-system_*.log,/var/log/containers/*_knative-serving_*.log,/var/log/containers/*_config-management-system_*.log,/var/log/containers/*_gke-managed-*_*.log
        Parser            cri
        Docker_Mode       On
        Docker_Mode_Parser docker
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_workload.db
        Skip_Long_Lines   On
        Refresh_Interval  5
        Rotate_Wait       30
        Path_Key          source_path

    [INPUT]
        Name              tail
        Tag               node.syslog
        Path              /var/log/syslog,/var/log/messages
        Parser            syslog
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_syslog.db
        Skip_Long_Lines   On

    [INPUT]
        Name              systemd
        Tag               node.kubelet
        Systemd_Filter    _SYSTEMD_UNIT=kubelet.service
        Read_From_Tail    On

    [INPUT]
        Name              systemd
        Tag               node.containerd
        Systemd_Filter    _SYSTEMD_UNIT=containerd.service
        Read_From_Tail    On

  provider-extra.conf: |
    [INPUT]
        Name              tail
        Tag               kube.system.var.log.containers.*
        Path              /var/log/containers/*_kube-system_*.log,/var/log/containers/*_gke-system_*.log,/var/log/containers/*_gmp-system_*.log
        Parser            cri
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_gke_system_containers.db
        Skip_Long_Lines   On
        Refresh_Interval  5
        Rotate_Wait       30
        Path_Key          source_path

    [INPUT]
        Name              tail
        Tag               kube.system.var.log.containers.*
        Path              /var/log/containers/*_istio-system_*.log,/var/log/containers/*_knative-serving_*.log,/var/log/containers/*_config-management-system_*.log,/var/log/containers/*_gke-managed-*_*.log
        Parser            cri
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_gke_optional_system_containers.db
        Skip_Long_Lines   On
        Refresh_Interval  5
        Rotate_Wait       30
        Path_Key          source_path

    [INPUT]
        Name              systemd
        Tag               node.node-problem-detector
        Systemd_Filter    _SYSTEMD_UNIT=node-problem-detector.service
        Read_From_Tail    On

    [INPUT]
        Name              systemd
        Tag               node.kubelet-monitor
        Systemd_Filter    _SYSTEMD_UNIT=kubelet-monitor.service
        Read_From_Tail    On

    [INPUT]
        Name              systemd
        Tag               node.kube-container-runtime-monitor
        Systemd_Filter    _SYSTEMD_UNIT=kube-container-runtime-monitor.service
        Read_From_Tail    On

    [INPUT]
        Name              systemd
        Tag               node.kube-node-installation
        Systemd_Filter    _SYSTEMD_UNIT=kube-node-installation.service
        Read_From_Tail    On

    [INPUT]
        Name              systemd
        Tag               node.kube-node-configuration
        Systemd_Filter    _SYSTEMD_UNIT=kube-node-configuration.service
        Read_From_Tail    On

    [INPUT]
        Name              systemd
        Tag               node.kube-logrotate
        Systemd_Filter    _SYSTEMD_UNIT=kube-logrotate.service
        Read_From_Tail    On

    [INPUT]
        Name              systemd
        Tag               node.gcfsd
        Systemd_Filter    _SYSTEMD_UNIT=gcfsd.service
        Read_From_Tail    On

    [INPUT]
        Name              systemd
        Tag               node.gcfs-snapshotter
        Systemd_Filter    _SYSTEMD_UNIT=gcfs-snapshotter.service
        Read_From_Tail    On

    [INPUT]
        Name              systemd
        Tag               node.criproxy
        Systemd_Filter    _SYSTEMD_UNIT=criproxy.service
        Read_From_Tail    On

    [INPUT]
        Name              systemd
        Tag               node.container-runtime
        Systemd_Filter    _SYSTEMD_UNIT=container-runtime.service
        Read_From_Tail    On

    [INPUT]
        Name              systemd
        Tag               node.docker
        Systemd_Filter    _SYSTEMD_UNIT=docker.service
        Read_From_Tail    On

    [INPUT]
        Name              tail
        Tag               node.gvisor
        Path              /var/log/pods/*/*.log
        Exclude_Path      /var/log/pods/*/*_panic.log
        Key               message
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_gke_gvisor.db
        Skip_Long_Lines   On
        Refresh_Interval  5
        Rotate_Wait       30
        Path_Key          source_path

    [INPUT]
        Name              tail
        Tag               node.gvisor-panic
        Path              /var/log/pods/*/*_panic.log
        Key               message
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_gke_gvisor_panic.db
        Skip_Long_Lines   On
        Refresh_Interval  5
        Rotate_Wait       30
        Path_Key          source_path

    [INPUT]
        Name              tail
        Tag               node.kube-proxy
        Path              /var/log/kube-proxy.log
        Key               message
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_gke_kube_proxy.db
        Skip_Long_Lines   On
        Refresh_Interval  5
        Rotate_Wait       30

    [INPUT]
        Name              tail
        Tag               node.startup
        Path              /var/log/startupscript.log,/var/log/startup-script.log
        Parser            syslog
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_gke_startup.db
        Skip_Long_Lines   On

    [INPUT]
        Name              tail
        Tag               cni.gke-network
        Path              /var/log/network/policy.log,/var/log/networkpolicy.log,/var/log/kubenet.log
        Parser            syslog
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_gke_network.db
        Skip_Long_Lines   On

    [INPUT]
        Name              tail
        Tag               cni.gke-policy-action
        Path              /var/log/network/policy_action.log
        Key               message
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_gke_policy_action.db
        Skip_Long_Lines   On
        Refresh_Interval  5
        Rotate_Wait       30

    [FILTER]
        Name                kubernetes
        Match               kube.system.var.log.containers.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.system.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       structured_log
        Labels              On
        Annotations         Off
        Buffer_Size         1MB

    [FILTER]
        Name                modify
        Match               kube.system.var.log.containers.*
        Add                 log_type system
        Add                 source system-namespace

    [FILTER]
        Name                modify
        Match               node.node-problem-detector
        Add                 source node-problem-detector

    [FILTER]
        Name                modify
        Match               node.kubelet-monitor
        Add                 source kubelet-monitor

    [FILTER]
        Name                modify
        Match               node.kube-container-runtime-monitor
        Add                 source kube-container-runtime-monitor

    [FILTER]
        Name                modify
        Match               node.kube-node-installation
        Add                 source kube-node-installation

    [FILTER]
        Name                modify
        Match               node.kube-node-configuration
        Add                 source kube-node-configuration

    [FILTER]
        Name                modify
        Match               node.kube-logrotate
        Add                 source kube-logrotate

    [FILTER]
        Name                modify
        Match               node.gcfsd
        Add                 source gcfsd

    [FILTER]
        Name                modify
        Match               node.gcfs-snapshotter
        Add                 source gcfs-snapshotter

    [FILTER]
        Name                modify
        Match               node.criproxy
        Add                 source criproxy

    [FILTER]
        Name                modify
        Match               node.container-runtime
        Add                 source container-runtime

    [FILTER]
        Name                modify
        Match               node.docker
        Add                 source docker

    [FILTER]
        Name                modify
        Match               node.gvisor
        Add                 source gvisor

    [FILTER]
        Name                modify
        Match               node.gvisor-panic
        Add                 source gvisor-panic

    [FILTER]
        Name                modify
        Match               node.kube-proxy
        Add                 source kube-proxy

    [FILTER]
        Name                modify
        Match               node.startup
        Add                 source startup-script

    [FILTER]
        Name                modify
        Match               cni.gke-policy-action
        Add                 source policy-action

    [FILTER]
        Name                modify
        Match               cni.*
        Add                 source network-policy
        Add                 log_type cni
        Add                 workload node
        Add                 namespace kube-system
        Add                 pod n/a
        Add                 container n/a
