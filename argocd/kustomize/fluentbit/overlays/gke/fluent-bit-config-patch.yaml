apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: fluent-bit
data:
  provider-extra.conf: |
    [INPUT]
        Name              tail
        Tag               kube.system.var.log.containers.*
        Path              /var/log/containers/*_kube-system_*.log,/var/log/containers/*_gke-system_*.log,/var/log/containers/*_gmp-system_*.log,/var/log/containers/*_istio-system_*.log,/var/log/containers/*_knative-serving_*.log,/var/log/containers/*_config-management-system_*.log,/var/log/containers/*_gke-managed-*_*.log
        Parser            cri
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_gke_system_containers.db
        Skip_Long_Lines   On
        Refresh_Interval  5
        Rotate_Wait       30
        Path_Key          source_path

    [INPUT]
        Name              systemd
        Tag               node.node-problem-detector
        Systemd_Filter    _SYSTEMD_UNIT=node-problem-detector.service
        Read_From_Tail    On

    [INPUT]
        Name              systemd
        Tag               node.kubelet-monitor
        Systemd_Filter    _SYSTEMD_UNIT=kubelet-monitor.service
        Read_From_Tail    On

    [INPUT]
        Name              systemd
        Tag               node.kube-container-runtime-monitor
        Systemd_Filter    _SYSTEMD_UNIT=kube-container-runtime-monitor.service
        Read_From_Tail    On

    [INPUT]
        Name              tail
        Tag               node.startup
        Path              /var/log/startupscript.log,/var/log/startup-script.log
        Parser            syslog
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_gke_startup.db
        Skip_Long_Lines   On

    [INPUT]
        Name              tail
        Tag               cni.gke-network
        Path              /var/log/network/policy.log,/var/log/networkpolicy.log,/var/log/kubenet.log
        Parser            syslog
        Mem_Buf_Limit     5MB
        DB                /var/log/flb_gke_network.db
        Skip_Long_Lines   On

    [FILTER]
        Name                kubernetes
        Match               kube.system.var.log.containers.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.system.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log
        Labels              On
        Annotations         Off
        Buffer_Size         1MB

    [FILTER]
        Name                modify
        Match               kube.system.var.log.containers.*
        Add                 log_type system
        Add                 source system-namespace

    [FILTER]
        Name                modify
        Match               node.kubelet
        Add                 source kubelet

    [FILTER]
        Name                modify
        Match               node.containerd
        Add                 source containerd

    [FILTER]
        Name                modify
        Match               node.node-problem-detector
        Add                 source node-problem-detector

    [FILTER]
        Name                modify
        Match               node.kubelet-monitor
        Add                 source kubelet-monitor

    [FILTER]
        Name                modify
        Match               node.kube-container-runtime-monitor
        Add                 source kube-container-runtime-monitor

    [FILTER]
        Name                modify
        Match               node.startup
        Add                 source startup-script

    [FILTER]
        Name                modify
        Match               cni.*
        Add                 source network-policy
        Add                 log_type cni
        Add                 workload node
        Add                 namespace kube-system
        Add                 pod host
        Add                 container host
        Add                 node_pool unknown
