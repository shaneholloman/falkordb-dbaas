# SealedSecret: wazuh-cluster-key
# Contains the Wazuh inter-node cluster key.
# Seal with: kubeseal --format yaml --cert certs/ctrl-plane/sealed-secrets/dev/pub-cert.pem
#             --controller-name=sealed-secrets --controller-namespace=kube-system
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: wazuh-cluster-key
  namespace: security
spec:
  encryptedData:
    key: 
  template:
    metadata:
      name: wazuh-cluster-key
      namespace: security
    type: Opaque
