# cont-init.d script that injects the cluster key from a mounted Secret
# into ossec.conf AFTER the chart's 0-wazuh-init has copied config files
# from /wazuh-config-mount (which overwrites the initContainer's sed).
#
# Naming: "1-inject-key" runs between 0-wazuh-init and 2-manager.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-cluster-key-injector
  namespace: security
  labels:
    app: wazuh
    component: manager
data:
  inject-key.sh: |
    #!/bin/sh
    KEY_FILE=/run/secrets/cluster-key/key
    OSSEC_CONF=/var/ossec/etc/ossec.conf
    if [ -f "$KEY_FILE" ] && [ -f "$OSSEC_CONF" ]; then
      CLUSTER_KEY=$(cat "$KEY_FILE")
      sed -i "s|<key>[a-zA-Z0-9_-]\{1,\}</key>|<key>${CLUSTER_KEY}</key>|" "$OSSEC_CONF"
      echo "Cluster key injected into ossec.conf"
    else
      echo "WARNING: cluster key file or ossec.conf not found" >&2
    fi
    # Fix auth force timers — the Helm template sets 1h defaults but Wazuh
    # only reads the first <auth> block, so extraConf overrides are ignored.
    if [ -f "$OSSEC_CONF" ]; then
      sed -i 's|<disconnected_time enabled="yes">1h</disconnected_time>|<disconnected_time enabled="yes">0</disconnected_time>|g' "$OSSEC_CONF"
      sed -i 's|<after_registration_time>1h</after_registration_time>|<after_registration_time>0</after_registration_time>|g' "$OSSEC_CONF"
      echo "Auth force timers set to 0"
    fi
    # Increase JSON decoder field limit — default 256 is too low for complex
    # events (Prowler findings, Grype output, K8s audit logs with many fields).
    INTERNAL_OPTS=/var/ossec/etc/local_internal_options.conf
    if ! grep -q 'analysisd.decoder_order_size' "$INTERNAL_OPTS" 2>/dev/null; then
      echo "analysisd.decoder_order_size=1024" >> "$INTERNAL_OPTS"
      echo "JSON decoder field limit raised to 1024"
    fi
