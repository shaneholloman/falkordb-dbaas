# PodDisruptionBudget for the Wazuh master.
# Worker and indexer PDBs are rendered by the Helm chart; duplicating them here
# prevents the eviction subresource from draining nodes.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wazuh-manager-master-pdb
  namespace: security
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: wazuh-manager
      node-type: master
