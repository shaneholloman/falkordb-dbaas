apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security
resources:
  - ../../base
  - secrets-env-secret.yaml
configMapGenerator:
  - name: cloud-evidence-config
    behavior: create
    literals:
      - cloud-provider=gcp
      - gcp-project-ids=ctrl-plane-dev-f7a2434f,app-plane-dev-f7a2434f
  - name: cloud-evidence-script
    behavior: create
    files:
      - collect_cloud_evidence.py=../../base/collect_cloud_evidence.py
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: wi-patch.yaml
