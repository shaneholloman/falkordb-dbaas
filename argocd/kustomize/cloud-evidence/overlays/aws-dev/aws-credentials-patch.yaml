# Patch the CronJob to inject AWS credentials + GCS SA key for upload.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloud-evidence-collector
  namespace: security
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: collector
              env:
                - name: AWS_ROLE_ARN
                  valueFrom:
                    secretKeyRef:
                      name: cloud-evidence-aws-credentials
                      key: role-arn
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef:
                      name: cloud-evidence-aws-credentials
                      key: region
                - name: AWS_WEB_IDENTITY_TOKEN_FILE
                  value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /var/run/secrets/gcs/sa-key.json
              volumeMounts:
                - name: gcs-sa-key
                  mountPath: /var/run/secrets/gcs
                  readOnly: true
          volumes:
            - name: gcs-sa-key
              secret:
                secretName: cloud-evidence-gcs-credentials
