apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: security
resources:
  - ../../base
  - secrets-env-secret.yaml
configMapGenerator:
  - name: cloud-evidence-config
    behavior: create
    literals:
      - cloud-provider=aws
      - aws-region=us-east-2
  - name: cloud-evidence-script
    behavior: create
    files:
      - collect_cloud_evidence.py=../../base/collect_cloud_evidence.py
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: aws-credentials-patch.yaml
  - path: remove-nodeselector-patch.yaml
  - path: irsa-patch.yaml
