---
apiVersion: alertreaction.io/v1alpha1
kind: AlertReaction
metadata:
  name: bgrewriteaof-fork-killer
  namespace: observability
spec:
  alertName: FalkorDBAOFPendingRewriteCritical
  actions:
  - name: kill-stuck-aof-fork
    image: bitnami/kubectl:latest
    serviceAccount: alert-reaction-actions-sa
    command: ["sh", "-c"]
    args:
      - |
        echo "=========================================="
        echo "FalkorDBAOFPendingRewriteCritical Alert Triggered"
        echo "Cluster: ${CLUSTER}"
        echo "Pod: ${POD_NAME}"
        echo "Namespace: ${NAMESPACE}"
        echo "=========================================="

        # Install omnistrate-ctl
        export HOME=/tmp
        curl -fsSL https://raw.githubusercontent.com/omnistrate-oss/omnistrate-ctl/main/install-ctl.sh | sh
        export PATH="$HOME/.omnistrate/bin:$PATH"

        # Normalize GCP cluster name to deployment cell ID
        # GCP passes "c-hc<id>" but omnistrate-ctl expects "hc-<id>"
        if echo "$CLUSTER" | grep -q "^c-hc"; then
          DEPLOYMENT_CELL="hc-${CLUSTER#c-hc}"
          echo "Normalized GCP cluster name: $CLUSTER -> $DEPLOYMENT_CELL"
        else
          DEPLOYMENT_CELL="$CLUSTER"
        fi

        # Authenticate to omnistrate using API key
        echo "$OMNISTRATE_API_KEY" | omnistrate-ctl login --api-key-stdin

        # Get kubeconfig for the target cluster
        script -q -c \
          "omnistrate-ctl deployment-cell update-kubeconfig \"$DEPLOYMENT_CELL\" --role cluster-admin --kubeconfig /tmp/kubeconfig" \
          /dev/null

        export KUBECONFIG=/tmp/kubeconfig

        echo "Executing fork-killer logic on pod ${POD_NAME} in namespace ${NAMESPACE}..."

        kubectl exec -n "${NAMESPACE}" "${POD_NAME}" -c service -- bash -c '
        set -u

        aof_rewrite=$(redis-cli -a "$(cat /run/secrets/adminpassword)" --no-auth-warning info persistence | grep "aof_rewrite_in_progress" | grep ":1")
        aof_pending=$(redis-cli -a "$(cat /run/secrets/adminpassword)" --no-auth-warning info persistence | grep "aof_pending_rewrite" | grep ":1")
        if [[ -z "$aof_rewrite" && -z "$aof_pending" ]]; then
          echo "FORK_KILL_FAILED: neither AOF rewrite nor pending rewrite are active, expected at least one to be 1"
          exit 1
        fi
        redis_pid=$(redis-cli -a "$(cat /run/secrets/adminpassword)" --no-auth-warning info server | grep process_id | cut -d":" -f2 | tr -d "\n\r")
        if [[ -z "$redis_pid" ]]; then
          echo "FORK_KILL_FAILED: Could not determine Redis server PID"
          exit 1
        fi
        forks=$(cat /proc/"$redis_pid"/task/"$redis_pid"/children)

        if [[ -z "$forks" ]]; then
          echo "FORK_KILL_FAILED: bgsave/aof in progress but no child process found in /proc/$redis_pid/task/$redis_pid/children"
          exit 1
        fi

        fork_count=$(echo "$forks" | wc -w)

        if [[ "$fork_count" -gt 1 ]]; then
          echo "FORK_KILL_FAILED: More than one child process found, cannot determine which one to kill"
          exit 1
        fi

        p=${forks%% *}

        if [[ "$redis_pid" -eq "$p" ]]; then
          echo "FORK_KILL_FAILED: Child process ID is the same as the Redis server process ID, cannot kill"
          exit 1
        fi

        if ! kill -9 "$p"; then
          echo "FORK_KILL_FAILED: Failed to kill process $p"
          exit 1
        fi
        echo "killed the process $p"

        # Wait for Redis to reap the dead child, then trigger a fresh BGSAVE
        # to clear lastbgsave_status and prevent MISCONF stop-writes-on-bgsave-error
        sleep 2
        redis-cli -a "$(cat /run/secrets/adminpassword)" --no-auth-warning BGSAVE
        echo "Triggered fresh BGSAVE to reset error state"
        sleep 5
        redis-cli -a "$(cat /run/secrets/adminpassword)" --no-auth-warning BGREWRITEAOF
        echo "Triggered BGREWRITEAOF to complete the pending rewrite"
        ' 2>&1

        EXIT_CODE=$?
        if [ $EXIT_CODE -ne 0 ]; then
          echo "❌ Fork killer script failed (exit code ${EXIT_CODE})"
          exit 1
        fi

        echo "✅ Fork killer script completed successfully"
    env:
    - name: POD_NAME
      valueFrom:
        alertRef:
          fieldPath: "labels.pod"
    - name: NAMESPACE
      valueFrom:
        alertRef:
          fieldPath: "labels.namespace"
    - name: CLUSTER
      valueFrom:
        alertRef:
          fieldPath: "labels.cluster"
    - name: ENVIRONMENT
      valueFrom:
        alertRef:
          fieldPath: "labels.environment"
    - name: OMNISTRATE_API_KEY
      valueFrom:
        secretKeyRef:
          name: omnistrate-api-key
          key: api-key
