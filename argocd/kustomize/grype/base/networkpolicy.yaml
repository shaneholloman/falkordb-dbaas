# NetworkPolicy — Grype CVE scanner CronJob pods
# Denies all ingress. Egress unrestricted (batch job needs metadata server,
# container registries, GCS, DNS, PyPI, GitHub, Wazuh syslog).
# NOTE: Egress cannot be restricted while GKE uses Calico, because Calico
# evaluates rules post-DNAT which breaks metadata server access (169.254.169.254
# is DNAT'd to node-local pod on port 988).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grype-netpol
  namespace: security
spec:
  podSelector:
    matchLabels:
      app: grype
  policyTypes:
    - Ingress
  ingress: []
