# Reduce grype memory request to fit on e2-standard-2 nodes (~6Gi allocatable)
# alongside wazuh-agent, alloy, and system pods. Keep limit high enough for
# large image scans (Grype DB + SBOM can spike to ~4-5Gi).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: grype-cve-scan
  namespace: security
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: grype
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "2"
                  memory: "6Gi"
