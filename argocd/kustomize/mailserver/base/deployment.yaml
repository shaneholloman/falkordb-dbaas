apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailserver
  namespace: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mailserver
  template:
    metadata:
      labels:
        app: mailserver
    spec:
      containers:
        - name: mailserver
          image: docker.io/falkordb/saasbuilder-mail:0.3.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: mailserver-env
          resources:
            requests:
              memory: "100Mi"
              cpu: "50m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 100Mi
      nodeSelector:
        node_pool: backend
